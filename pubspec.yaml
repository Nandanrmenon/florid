name: florid
description: "A modern F-Droid client for Android built with Flutter."
publish_to: "none"

version: 1.4.0+17

environment:
  sdk: ^3.9.2
  flutter: ^3.44.1

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.9

  # HTTP client for API calls
  http: ^1.6.0

  # JSON serialization
  json_annotation: ^4.12.0

  # State management
  provider: ^6.1.5+1

  # URL launcher for external links
  url_launcher: ^6.3.2

  # Path provider for file storage
  path_provider: ^2.1.6

  # Path utilities for file paths
  path: ^1.9.1

  # Material Symbols icon pack
  material_symbols_icons: ^4.2960.0

  # Material You dynamic color
  dynamic_color: ^1.8.1

  # Local key-value storage for settings
  shared_preferences: ^2.5.5

  # SQLite database for app data storage
  sqflite: ^2.4.3

  # Permission handler for Android permissions
  permission_handler: ^13.0.0

  # Package info for app version checking
  package_info_plus: ^10.2.1

  # Device info for ABI detection
  device_info_plus: ^13.2.0

  # Cached network image for app icons
  cached_network_image: ^3.4.1

  # Cache manager used by cached_network_image
  flutter_cache_manager: ^3.4.2

  # File picker and downloads
  dio: ^5.11.0
  file_picker: ^12.0.0-beta.7
  workmanager: ^0.10.6

  # App installer for APK installation
  app_installer: ^1.3.1

  # Shizuku-based installer
  shizuku_api: 1.2.2

  # Share plus for sharing apps
  share_plus: ^13.3.0

  # Detect installed applications on Android
  installed_apps: ^2.1.1

  # Launch Android intents (used for uninstall)
  android_intent_plus: ^6.1.0

  # Local notifications for download progress
  flutter_local_notifications: ^22.2.0
  flutter_native_splash: ^2.4.8
  flutter_animate: ^4.5.2

  # HTML rendering
  flutter_html: ^3.0.0
  markdown: ^7.3.1
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_svg: ^2.3.0
  qr_code_scanner_plus: ^2.2.0
  local_auth: ^3.0.2
  iconify_flutter: ^0.0.7
  solar_icons: ^0.1.0
  flutter_m3shapes_extended: ^1.2.0
  m3e_core: ^0.1.5
  hornbill: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation for JSON serialization
  json_serializable: ^6.7.1
  build_runner: ^2.4.7
  icons_launcher: ^3.0.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/Florid.png
    - assets/Foreground.png
    - assets/Splash.png
    - assets/Florid.svg
    - assets/repositories.json
    - CHANGELOGS.md
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-VariableFont.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-VariableFont.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
